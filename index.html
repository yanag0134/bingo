<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ビンゴ番号抽選</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9f0f6;
      --panel: #ffffff;
      --ink: #1d2b4a;
      --ink-soft: #5a6785;
      --chip: #dfe7f0;
      --face: #ffffff;
      --ball: #d7263d;
      --ball-light: #f0707e;
      --ball-dark: #8f1424;
      --latest: #f5b700;
      --double: #7a4fd6;
      --reach: #e8336b;
      --reach-dark: #b31d4f;
      --machine: #2e64c8;
      --machine-light: #5d8fe6;
      --machine-dark: #1d4594;
      --dome: rgba(255, 255, 255, 0.5);
      --dome-edge: #b8c7db;
      --metal-light: #ffffff;
      --metal: #c9d1dc;
      --metal-dark: #8390a4;
      --gold: #ffcf3a;

      /* リーチの帯の太さ */
      --band-h: clamp(44px, 10vmin, 120px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16203a;
        --panel: #1f2b4a;
        --ink: #eef2f8;
        --ink-soft: #a9b4cc;
        --chip: #2c3a5e;
        --double: #a585ff;
        --dome: rgba(255, 255, 255, 0.14);
        --dome-edge: #50618a;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16203a;
      --panel: #1f2b4a;
      --ink: #eef2f8;
      --ink-soft: #a9b4cc;
      --chip: #2c3a5e;
      --double: #a585ff;
      --dome: rgba(255, 255, 255, 0.14);
      --dome-edge: #50618a;
      color-scheme: dark;
    }

    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    html {
      height: 100%;
      overflow: hidden;
      scroll-padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
      font-weight: 500;
      line-height: 1.6;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* 横画面（スクリーン投影）：左にガチャと玉、右端に出た番号の一覧 */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(250px, 25vw, 460px);
      grid-template-rows: minmax(0, 1fr);
      height: 100%;
    }

    .stage {
      /* ガチャ本体の大きさの基準。画面の高さと、この領域の幅の両方に収まるように伸び縮みする */
      --u: min(0.16vh, 0.133cqw);
      container-type: inline-size;
      position: relative;
      z-index: 30;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: min(5vmin, 3cqw);
      padding: 3vmin;
      padding-left: max(3vmin, env(safe-area-inset-left, 0px));
    }

    /* ---------- ガチャガチャ本体 ---------- */
    .machine {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dome {
      position: relative;
      z-index: 1;
      width: calc(200 * var(--u));
      aspect-ratio: 1;
      margin-bottom: calc(-40 * var(--u));
      border-radius: 50%;
      border: calc(4 * var(--u)) solid var(--dome-edge);
      background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.95), var(--dome) 42%);
      overflow: hidden;
    }
    .pile {
      position: absolute;
      inset: 0;
    }
    .pile span {
      --c: #d7263d; /* 既定の色。HTML側の style="--c:..." で1つずつ上書きする */
      position: absolute;
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: linear-gradient(to bottom, var(--c) 50%, #ffffff 50%);
      box-shadow: inset 0 calc(-3 * var(--u)) 0 rgba(0, 0, 0, 0.08), 0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0, 0, 0, 0.15);
    }
    .cabinet {
      position: relative;
      z-index: 2;
      width: calc(240 * var(--u));
      height: calc(230 * var(--u));
      padding-top: calc(10 * var(--u));
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: calc(24 * var(--u)) calc(24 * var(--u)) calc(14 * var(--u)) calc(14 * var(--u));
      background: linear-gradient(to bottom, var(--machine-light), var(--machine) 16%, var(--machine-dark));
      box-shadow: 0 calc(18 * var(--u)) calc(26 * var(--u)) calc(-14 * var(--u)) rgba(20, 40, 90, 0.6);
    }

    /* ハンドル（このボタンを押すとガチャが回る） */
    .handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(5 * var(--u));
      padding: calc(4 * var(--u)) calc(12 * var(--u)) calc(6 * var(--u));
      border: none;
      border-radius: calc(18 * var(--u));
      background: none;
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      font-size: max(0.75rem, calc(16 * var(--u)));
      cursor: pointer;
      touch-action: manipulation;
    }
    .handle:focus-visible { outline: 3px solid var(--latest); outline-offset: 2px; }
    .handle:disabled { cursor: not-allowed; }
    /* 回している最中は押せないが、見た目は薄くしない（50個出終わったときだけ薄くする） */
    .handle:disabled:not(.is-turning) { opacity: 0.45; }
    .knob-area {
      position: relative;
      width: calc(128 * var(--u));
      height: calc(128 * var(--u));
      display: grid;
      place-items: center;
    }
    .turn-arrow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.55;
    }
    .knob {
      width: calc(88 * var(--u));
      height: calc(88 * var(--u));
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 30%, var(--metal-light), var(--metal) 55%, var(--metal-dark));
      box-shadow: 0 calc(4 * var(--u)) 0 rgba(0, 0, 0, 0.28), inset 0 calc(-4 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.18);
      transition: transform 200ms ease;
    }
    .handle:not(:disabled):hover .knob { transform: rotate(20deg); }
    .grip {
      width: calc(76 * var(--u));
      height: calc(24 * var(--u));
      border-radius: calc(12 * var(--u));
      background: linear-gradient(to bottom, #ffffff, var(--metal) 55%, var(--metal-dark));
      box-shadow: 0 calc(3 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, 0.32);
    }
    .outlet {
      margin-top: auto;
      margin-bottom: calc(16 * var(--u));
      width: calc(96 * var(--u));
      height: calc(54 * var(--u));
      border-radius: calc(14 * var(--u)) calc(14 * var(--u)) calc(10 * var(--u)) calc(10 * var(--u));
      background: #0f1c38;
      box-shadow: inset 0 calc(6 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .outlet::before {
      content: "";
      display: block;
      height: calc(20 * var(--u));
      background: rgba(255, 255, 255, 0.16);
    }

    /* ---------- 出てきた玉 ---------- */
    .result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5vmin;
    }
    .balls {
      /* 1個のときの玉の大きさ */
      --ball-size: min(60vh, 50cqw);
      display: flex;
      align-items: flex-end;
      gap: min(4vmin, 3cqw);
    }
    /* 2個のときは、2つとも同じ大きさにそろえる */
    .balls.is-double { --ball-size: min(42vh, 27cqw); }
    .slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ball-wrap {
      position: relative;
      width: var(--ball-size);
      aspect-ratio: 1;
    }
    .ball {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, var(--ball-light), var(--ball) 55%, var(--ball-dark));
      box-shadow: 0 calc(var(--ball-size) * 0.08) calc(var(--ball-size) * 0.14) calc(var(--ball-size) * -0.06) rgba(143, 20, 36, 0.55);
    }
    .ball.is-empty { filter: grayscale(0.85); opacity: 0.5; }
    .ball-face {
      width: 62%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--face);
      color: #1d2b4a;
      font-size: calc(var(--ball-size) * 0.34);
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    /* 2個出たときの順番（1個目が優先） */
    .order-badge {
      position: absolute;
      z-index: 2;
      top: calc(var(--ball-size) * -0.07);
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      padding: 0.15em 0.9em;
      border-radius: 999px;
      font-size: max(0.85rem, calc(var(--ball-size) * 0.075));
      font-weight: 800;
      white-space: nowrap;
    }
    .slot-first .order-badge {
      background: var(--double);
      color: #ffffff;
    }
    .slot-second .order-badge {
      background: var(--panel);
      color: var(--double);
      box-shadow: inset 0 0 0 0.12em var(--double);
    }
    .priority-note {
      max-width: min(100%, 32em);
      margin: 0;
      padding: 0.5em 1.1em;
      border-radius: 0.8em;
      background: var(--panel);
      color: var(--ink);
      font-size: clamp(0.85rem, 2.4vmin, 1.7rem);
      text-align: center;
      box-shadow: inset 0 0 0 0.13em var(--double);
    }
    .priority-note strong { color: var(--double); }

    /* 演出中にまだ出していない玉・表示は隠しておく */
    .slot.is-pending .ball,
    .slot.is-pending .order-badge,
    .priority-note.is-pending { opacity: 0; }

    .capsule {
      --cap: #f5b700; /* 既定の色。回すたびにJavaScriptで上書きする */
      position: absolute;
      z-index: 3;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      pointer-events: none;
    }
    .capsule.is-gold { box-shadow: 0 0 calc(var(--ball-size) * 0.12) calc(var(--ball-size) * 0.03) rgba(255, 207, 58, 0.85); }
    .capsule-top,
    .capsule-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
    }
    .capsule-top {
      top: 0;
      border-radius: 999px 999px 0 0;
      background: radial-gradient(circle at 32% 40%, rgba(255, 255, 255, 0.55), transparent 40%), var(--cap);
    }
    .capsule-bottom {
      bottom: 0;
      border-radius: 0 0 999px 999px;
      background: linear-gradient(to bottom, #ffffff, #dce3ec);
      border-top: calc(var(--ball-size) * 0.012) solid rgba(0, 0, 0, 0.1);
    }

    /* ---------- 2倍のときの演出用レイヤー ---------- */
    .fx-dim,
    .fx-flash,
    .fx-particles,
    .fx-rays {
      position: fixed;
      pointer-events: none;
      opacity: 0;
    }
    .fx-dim {
      z-index: 20;
      inset: 0;
      background: rgba(6, 10, 30, 0.82);
    }
    .fx-rays {
      z-index: 25;
      left: 50%;
      top: 50%;
      width: 170vmax;
      height: 170vmax;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(from 0deg, rgba(255, 214, 90, 0.55) 0deg 7deg, rgba(255, 214, 90, 0) 7deg 18deg);
      -webkit-mask-image: radial-gradient(circle, #000 0, #000 8%, transparent 42%);
      mask-image: radial-gradient(circle, #000 0, #000 8%, transparent 42%);
    }
    .fx-flash {
      z-index: 60;
      inset: 0;
      background: #ffffff;
    }
    .fx-particles {
      z-index: 55;
      inset: 0;
      overflow: hidden;
      opacity: 1;
    }
    .fx-piece {
      position: absolute;
      left: 0;
      top: 0;
    }

    /* ---------- リーチ中の帯 ---------- */
    /* 帯は、ガチャと玉が並ぶ領域（一覧を除いた部分）の右上・左下に出す */
    .reach-band {
      position: absolute;
      z-index: 50;
      width: 160vmin;
      height: var(--band-h);
      display: none;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--reach), var(--reach-dark));
      border-top: calc(var(--band-h) * 0.07) solid rgba(255, 255, 255, 0.75);
      border-bottom: calc(var(--band-h) * 0.07) solid rgba(255, 255, 255, 0.75);
      color: #ffffff;
      font-size: calc(var(--band-h) * 0.46);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 0.06em 0 rgba(120, 10, 50, 0.6);
      box-shadow: 0 1vmin 2.4vmin -0.6vmin rgba(120, 10, 50, 0.55);
      pointer-events: none;
    }
    /* 帯の中心を、角から内側へ寄せる */
    .reach-band.top-right {
      top: calc(14vmin - var(--band-h) / 2);
      right: calc(14vmin - 80vmin);
      transform: rotate(45deg);
    }
    .reach-band.bottom-left {
      bottom: calc(14vmin - var(--band-h) / 2);
      left: calc(14vmin - 80vmin);
      transform: rotate(45deg);
    }
    body.is-reach .reach-band {
      display: flex;
      animation: band-in 400ms ease-out;
    }
    .reach-track {
      display: flex;
      flex-shrink: 0;
      white-space: nowrap;
      animation: reach-flow 8s linear infinite;
    }
    .reach-track span { padding: 0 0.9em; }
    @keyframes reach-flow {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes band-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reach-track { animation: none; }
      body.is-reach .reach-band { animation: none; }
    }

    /* ---------- 出た番号の一覧 ---------- */
    .history {
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5vmin;
      padding: 3vmin 2.5vmin 0;
      padding-right: max(2.5vmin, env(safe-area-inset-right, 0px));
      background: var(--panel);
      border-left: 1px solid var(--chip);
    }
    .history h1 {
      margin: 0;
      font-size: clamp(1rem, 2.8vmin, 2.1rem);
      font-weight: 800;
      line-height: 1.3;
    }
    #history-dynamic {
      display: flex;
      flex-direction: column;
      gap: 1vmin;
    }
    .progress {
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(0.9rem, 2.4vmin, 1.6rem);
      line-height: 1.2;
    }
    .progress strong {
      color: var(--ink);
      font-size: clamp(1.4rem, 6.5vmin, 4.6rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .notice { margin: 0; font-weight: 800; font-size: clamp(0.85rem, 2vmin, 1.3rem); }
    .history h2 {
      margin: 1vmin 0 0.4vmin;
      font-size: clamp(0.9rem, 2.3vmin, 1.5rem);
    }
    .history h2 small { color: var(--ink-soft); font-weight: 500; font-size: 0.8em; }
    .history-empty { margin: 0; color: var(--ink-soft); font-size: clamp(0.85rem, 2vmin, 1.3rem); }
    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.9vmin;
    }
    .history-list li {
      position: relative;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--chip);
      font-size: clamp(0.8rem, 2.2vmin, 1.5rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .history-list li.is-latest {
      background: var(--latest);
      color: #1d2b4a;
    }
    /* 2倍で同時に出た番号：紫の枠と、出た順の小さな数字 */
    .history-list li[data-order] { box-shadow: inset 0 0 0 0.16em var(--double); }
    .history-list li[data-order]::after {
      content: attr(data-order);
      position: absolute;
      top: -0.25em;
      left: -0.25em;
      width: 1.6em;
      height: 1.6em;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--double);
      color: #ffffff;
      font-size: 0.6em;
      line-height: 1;
    }
    .history-legend {
      margin: 0.5vmin 0 0;
      color: var(--ink-soft);
      font-size: clamp(0.7rem, 1.7vmin, 1.1rem);
      line-height: 1.5;
    }

    .controls {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1vmin;
      padding: 1.5vmin 0 2.5vmin;
      background: var(--panel);
    }
    .controls button {
      padding: 0.6em 0.5em;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: clamp(0.85rem, 2.2vmin, 1.4rem);
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }
    .controls button:focus-visible { outline: 3px solid var(--latest); outline-offset: 3px; }
    .controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    .controls .is-wide { grid-column: 1 / -1; }
    .btn-reach {
      background: transparent;
      color: var(--reach);
      box-shadow: inset 0 0 0 0.13em var(--reach);
    }
    .btn-reach[aria-pressed="true"] {
      background: var(--reach);
      color: #ffffff;
    }
    .btn-reset,
    .btn-fullscreen {
      background: transparent;
      box-shadow: inset 0 0 0 0.13em var(--chip);
      color: var(--ink-soft);
    }

    /* 横画面でも幅の狭い機種（iPhone SE など）は、一覧を細くして玉と帯がぶつからないようにする */
    @media (orientation: landscape) and (max-width: 740px) {
      .layout { grid-template-columns: minmax(0, 1fr) 215px; }
      .history-list { grid-template-columns: repeat(5, 1fr); }
      .reach-band.top-right { top: calc(10.5vmin - var(--band-h) / 2); right: calc(10.5vmin - 80vmin); }
      .reach-band.bottom-left { bottom: calc(10.5vmin - var(--band-h) / 2); left: calc(10.5vmin - 80vmin); }
    }

    /* ---------- 縦画面（スマホを縦に持ったとき） ---------- */
    @media (orientation: portrait) {
      html, body { overflow-x: hidden; overflow-y: auto; }
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        height: auto;
        min-height: 100%;
      }
      .stage {
        --u: min(1px, 0.25cqw);
        flex-direction: column;
        justify-content: flex-start;
        gap: 3vh;
        padding: 3vh 4vw 4vh;
      }
      .balls { --ball-size: min(52cqw, 30vh); }
      .balls.is-double { --ball-size: min(40cqw, 24vh); }
      .history {
        overflow: visible;
        border-left: none;
        border-top: 1px solid var(--chip);
        padding: 3vh 5vw 0;
      }
    }
  </style>
</head>
<body>

<div class="fx-dim" id="fx-dim" aria-hidden="true"></div>
<div class="fx-rays" id="fx-rays" aria-hidden="true"></div>
<div class="fx-particles" id="fx-particles" aria-hidden="true"></div>
<div class="fx-flash" id="fx-flash" aria-hidden="true"></div>

<div class="layout">

  <main class="stage">
    <div class="reach-band top-right" aria-hidden="true">
      <div class="reach-track">
        <span>リーチ中</span><span>リーチ中</span><span>リーチ中</span><span>リーチ中</span>
        <span>リーチ中</span><span>リーチ中</span><span>リーチ中</span><span>リーチ中</span>
        <span>リーチ中</span><span>リーチ中</span><span>リーチ中</span><span>リーチ中</span>
      </div>
    </div>
    <div class="reach-band bottom-left" aria-hidden="true">
      <div class="reach-track">
        <span>リーチ中</span><span>リーチ中</span><span>リーチ中</span><span>リーチ中</span>
        <span>リーチ中</span><span>リーチ中</span><span>リーチ中</span><span>リーチ中</span>
        <span>リーチ中</span><span>リーチ中</span><span>リーチ中</span><span>リーチ中</span>
      </div>
    </div>

    <div class="machine" id="machine">
      <div class="dome" id="dome">
        <div class="pile" id="pile" aria-hidden="true">
          <span style="--c:#d7263d; left:7%;  bottom:11%; transform:rotate(25deg)"></span>
          <span style="--c:#f5b700; left:26%; bottom:6%;  transform:rotate(-40deg)"></span>
          <span style="--c:#2bb673; left:46%; bottom:4%;  transform:rotate(70deg)"></span>
          <span style="--c:#7a5cd6; left:66%; bottom:7%;  transform:rotate(-15deg)"></span>
          <span style="--c:#2e64c8; left:74%; bottom:26%; transform:rotate(110deg)"></span>
          <span style="--c:#ff8a3d; left:15%; bottom:30%; transform:rotate(-80deg)"></span>
          <span style="--c:#2bb673; left:35%; bottom:25%; transform:rotate(15deg)"></span>
          <span style="--c:#d7263d; left:55%; bottom:24%; transform:rotate(-120deg)"></span>
          <span style="--c:#f5b700; left:45%; bottom:44%; transform:rotate(60deg)"></span>
          <span style="--c:#7a5cd6; left:25%; bottom:48%; transform:rotate(-30deg)"></span>
        </div>
      </div>

      <div class="cabinet" id="cabinet">
        <button type="button" id="handle" class="handle">
          <span class="knob-area" aria-hidden="true">
            <svg class="turn-arrow" viewBox="0 0 128 128">
              <path d="M 108.4 26.7 A 58 58 0 0 1 108.4 101.3" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
              <path d="M 120.2 98.1 L 108.4 101.3 L 109.4 89.1" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="knob" id="knob"><span class="grip"></span></span>
          </span>
          <span>ガチャを回す</span>
        </button>
        <div class="outlet" id="outlet" aria-hidden="true"></div>
      </div>
    </div>

    <div class="result" id="result"></div>

    <p class="sr-only" id="status" aria-live="polite"></p>
  </main>

  <aside class="history">
    <h1>ビンゴ 1〜50</h1>
    <div id="history-dynamic"></div>
    <div class="controls">
      <button type="button" class="btn-reach is-wide" id="reach-button" aria-pressed="false">リーチ</button>
      <button type="button" class="btn-reset" id="reset-button">リセット</button>
      <button type="button" class="btn-fullscreen" id="fullscreen-button">全画面</button>
    </div>
  </aside>

</div>

<script>
  (function () {
    // ---------- 抽選のルール ----------
    const MIN_NUMBER = 1;
    const MAX_NUMBER = 50;
    const DOUBLE_CHANCE_DENOMINATOR = 10; // 2倍の当選確率 1/10
    const MAX_MISS_STREAK = 9;            // 9回連続で外れたら、次は必ず2倍
    const STORAGE_KEY = 'bingo-state-v1';

    function freshState() {
      const remaining = [];
      for (let n = MIN_NUMBER; n <= MAX_NUMBER; n++) {
        remaining.push(n);
      }
      // rounds：ガチャを回した1回ごとに出た番号（1個か2個。2個のときは出た順）
      return { remaining: remaining, rounds: [], missStreak: 0, reach: false };
    }

    // 端末に保存した状態を読み込む（画面を閉じても続きから再開できる）
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.remaining) && Array.isArray(saved.rounds)
            && typeof saved.missStreak === 'number' && typeof saved.reach === 'boolean') {
          return saved;
        }
      } catch (error) {
        // 読み込めないときは最初から始める
      }
      return freshState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        // 保存できない環境でも、抽選自体はそのまま続けられる
      }
    }

    let state = loadState();

    const randomInt = (bound) => Math.floor(Math.random() * bound);

    // ガチャを1回回す。通常は1個、2倍に当たったら2個（出た順に並ぶ）
    function draw() {
      if (state.remaining.length === 0) {
        return [];
      }
      const isDouble = state.missStreak >= MAX_MISS_STREAK
          || randomInt(DOUBLE_CHANCE_DENOMINATOR) === 0;
      state.missStreak = isDouble ? 0 : state.missStreak + 1;
      // 残りが1個しかないときは、2倍に当たっても1個だけ出す
      const count = (isDouble && state.remaining.length >= 2) ? 2 : 1;

      const round = [];
      for (let i = 0; i < count; i++) {
        const index = randomInt(state.remaining.length);
        round.push(state.remaining.splice(index, 1)[0]);
      }
      state.rounds.push(round);
      saveState();
      return round;
    }

    const drawnCount = () => state.rounds.reduce((sum, round) => sum + round.length, 0);
    const isFinished = () => state.remaining.length === 0;
    const lastRound = () => state.rounds.length ? state.rounds[state.rounds.length - 1] : [];

    // ---------- 画面の組み立て ----------
    const handle = document.getElementById('handle');
    const reachButton = document.getElementById('reach-button');
    const resetButton = document.getElementById('reset-button');
    const fullscreenButton = document.getElementById('fullscreen-button');
    const machine = document.getElementById('machine');
    const dome = document.getElementById('dome');
    const cabinet = document.getElementById('cabinet');
    const pile = document.getElementById('pile');
    const knob = document.getElementById('knob');
    const outlet = document.getElementById('outlet');
    const result = document.getElementById('result');
    const historyArea = document.getElementById('history-dynamic');
    const status = document.getElementById('status');
    const fxDim = document.getElementById('fx-dim');
    const fxRays = document.getElementById('fx-rays');
    const fxFlash = document.getElementById('fx-flash');
    const fxParticles = document.getElementById('fx-particles');

    function resultHtml(round) {
      if (round.length === 0) {
        return '<div class="balls"><div class="slot slot-first"><div class="ball-wrap">'
            + '<div class="ball is-empty"><div class="ball-face"><span>?</span></div></div>'
            + '</div></div></div>';
      }
      const isDouble = round.length === 2;
      const slots = round.map((n, i) => {
        const badge = isDouble
            ? '<p class="order-badge">' + (i === 0 ? '1個目（優先）' : '2個目') + '</p>'
            : '';
        return '<div class="slot ' + (i === 0 ? 'slot-first' : 'slot-second') + '">' + badge
            + '<div class="ball-wrap"><div class="ball"><div class="ball-face">'
            + '<span class="ball-number">' + n + '</span></div></div></div></div>';
      }).join('');
      const note = isDouble
          ? '<p class="priority-note">同時にビンゴになったときは、<strong>1個目</strong>の番号でビンゴになった人が優先です。</p>'
          : '';
      return '<div class="balls' + (isDouble ? ' is-double' : '') + '">' + slots + '</div>' + note;
    }

    function renderHistory() {
      let html = '<p class="progress"><strong>' + drawnCount() + '</strong> / '
          + (MAX_NUMBER - MIN_NUMBER + 1) + ' 個 出ました</p>';
      if (isFinished()) {
        html += '<p class="notice">50個すべて出ました。リセットすると最初からやり直せます。</p>';
      }
      html += '<h2>出た番号 <small>（出た順）</small></h2>';
      if (state.rounds.length === 0) {
        html += '<p class="history-empty">まだ番号は出ていません。ガチャを回すとここに並びます。</p>';
      } else {
        html += '<ol class="history-list">';
        state.rounds.forEach((round, r) => {
          const latest = r === state.rounds.length - 1 ? ' class="is-latest"' : '';
          round.forEach((n, i) => {
            const order = round.length === 2 ? ' data-order="' + (i + 1) + '"' : '';
            html += '<li' + latest + order + '>' + n + '</li>';
          });
        });
        html += '</ol>';
      }
      if (state.rounds.some((round) => round.length === 2)) {
        html += '<p class="history-legend">紫の枠は2倍で同時に出た番号です。左上の数字は出た順で、1が優先です。</p>';
      }
      historyArea.innerHTML = html;
    }

    function renderReach() {
      document.body.classList.toggle('is-reach', state.reach);
      reachButton.setAttribute('aria-pressed', String(state.reach));
      reachButton.textContent = state.reach ? 'リーチを解除' : 'リーチ';
    }

    function renderAll() {
      result.innerHTML = resultHtml(lastRound());
      renderHistory();
      renderReach();
      handle.disabled = isFinished();
    }

    // ---------- 演出 ----------
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const capsuleColors = ['#f5b700', '#2bb673', '#7a5cd6', '#ff8a3d', '#2e64c8', '#e84a8a'];
    const partyColors = ['#ffcf3a', '#ff5a7a', '#5ad1ff', '#7cf08a', '#b28bff', '#ffffff'];
    const TURN_MS = 2400;
    const RUMBLE_MS = 2200;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function centerOf(element) {
      const rect = element.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, width: rect.width };
    }

    // ハンドルを「ガチャ、ガチャ」と2段階で1回転させ、本体と中の玉を揺らす
    function turnHandle() {
      const knobTurn = knob.animate([
        { transform: 'rotate(0deg)', offset: 0, easing: 'ease-in-out' },
        { transform: 'rotate(180deg)', offset: 0.4 },
        { transform: 'rotate(180deg)', offset: 0.5, easing: 'ease-in-out' },
        { transform: 'rotate(360deg)', offset: 0.9 },
        { transform: 'rotate(360deg)', offset: 1 }
      ], { duration: TURN_MS });

      machine.animate([
        { transform: 'none', offset: 0 },
        { transform: 'none', offset: 0.38 },
        { transform: 'translateY(0.4vmin) rotate(-1.2deg)', offset: 0.42 },
        { transform: 'none', offset: 0.5 },
        { transform: 'none', offset: 0.88 },
        { transform: 'translateY(0.4vmin) rotate(1.2deg)', offset: 0.92 },
        { transform: 'none', offset: 1 }
      ], { duration: TURN_MS });

      pile.animate([
        { transform: 'rotate(0deg) translateY(0)' },
        { transform: 'rotate(-6deg) translateY(-3%)' },
        { transform: 'rotate(5deg) translateY(-1%)' },
        { transform: 'rotate(-3deg) translateY(-2.5%)' },
        { transform: 'rotate(0deg) translateY(0)' }
      ], { duration: TURN_MS / 2, iterations: 2, easing: 'ease-in-out' });

      return knobTurn.finished;
    }

    // 小さな光の粒を、指定した位置から四方へはじけさせる
    function burst(x, y, count, reach) {
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        piece.className = 'fx-piece';
        const size = 0.8 + Math.random() * 1.6; // vmin
        const angle = Math.random() * Math.PI * 2;
        const distance = reach * (0.45 + Math.random() * 0.55);
        const color = partyColors[randomInt(partyColors.length)];
        piece.style.width = size + 'vmin';
        piece.style.height = size + 'vmin';
        piece.style.background = color;
        piece.style.borderRadius = Math.random() < 0.5 ? '50%' : '0.15vmin';
        piece.style.boxShadow = '0 0 1.2vmin ' + color;
        fxParticles.appendChild(piece);
        const from = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
        const to = `translate(${x + Math.cos(angle) * distance}px, ${y + Math.sin(angle) * distance}px) translate(-50%, -50%) rotate(${randomInt(540)}deg) scale(0.2)`;
        piece.animate([
          { transform: from + ' scale(1)', opacity: 1 },
          { transform: to, opacity: 0 }
        ], { duration: 900 + Math.random() * 600, easing: 'cubic-bezier(.12, .8, .3, 1)' })
          .finished.then(() => piece.remove());
      }
    }

    // 画面いっぱいに紙吹雪を降らせる（終わるのを待たない）
    function confetti(count) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        piece.className = 'fx-piece';
        piece.style.width = (0.8 + Math.random() * 0.8) + 'vmin';
        piece.style.height = (1.4 + Math.random() * 1.4) + 'vmin';
        piece.style.background = partyColors[randomInt(partyColors.length)];
        fxParticles.appendChild(piece);
        const startX = Math.random() * width;
        const drift = (Math.random() - 0.5) * width * 0.3;
        const spin = 360 + randomInt(720);
        piece.animate([
          { transform: `translate(${startX}px, ${-height * 0.08}px) rotate(0deg)` },
          { transform: `translate(${startX + drift}px, ${height * 1.08}px) rotate(${spin}deg)` }
        ], {
          duration: 2200 + Math.random() * 1600,
          delay: Math.random() * 700,
          easing: 'cubic-bezier(.25, .4, .6, 1)',
          fill: 'backwards'
        }).finished.then(() => piece.remove());
      }
    }

    // 2倍の予兆：回し終えたあと、画面が暗くなり、本体が激しく震えて光り出す
    let raysSpin = null;
    async function doublePremonition() {
      const center = centerOf(machine);
      fxRays.style.left = center.x + 'px';
      fxRays.style.top = center.y + 'px';

      fxDim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: 'forwards' });
      fxRays.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, fill: 'forwards' });
      raysSpin = fxRays.animate([
        { transform: 'translate(-50%, -50%) rotate(0deg)' },
        { transform: 'translate(-50%, -50%) rotate(360deg)' }
      ], { duration: 9000, iterations: Infinity });

      // だんだん激しくなる震え
      const shake = [];
      const steps = 36;
      for (let i = 0; i <= steps; i++) {
        const power = i === steps ? 0 : 0.15 + (i / steps) * 0.9; // vmin
        const x = (Math.random() - 0.5) * 2 * power;
        const y = (Math.random() - 0.5) * 2 * power;
        const r = (Math.random() - 0.5) * 2 * power * 1.6;
        shake.push({ transform: `translate(${x}vmin, ${y}vmin) rotate(${r}deg)` });
      }
      machine.animate(shake, { duration: RUMBLE_MS, easing: 'linear' });

      // 中のカプセルが跳ね回る
      pile.animate([
        { transform: 'translateY(0) rotate(0deg)' },
        { transform: 'translateY(-14%) rotate(-10deg)' },
        { transform: 'translateY(-4%) rotate(8deg)' },
        { transform: 'translateY(-18%) rotate(-6deg)' },
        { transform: 'translateY(0) rotate(0deg)' }
      ], { duration: 360, iterations: Math.round(RUMBLE_MS / 360), easing: 'ease-in-out' });

      // 本体・ドーム・取出口が光って脈打つ
      const glow = '0 0 6vmin 1.6vmin rgba(255, 207, 58, 0.95)';
      const calm = '0 0 0 0 rgba(255, 207, 58, 0)';
      cabinet.animate([{ boxShadow: calm }, { boxShadow: glow }, { boxShadow: calm }],
          { duration: RUMBLE_MS / 4, iterations: 4, easing: 'ease-in-out' });
      dome.animate([{ boxShadow: calm }, { boxShadow: glow }, { boxShadow: calm }],
          { duration: RUMBLE_MS / 4, iterations: 4, easing: 'ease-in-out', delay: RUMBLE_MS / 8 });
      outlet.animate([{ background: '#0f1c38' }, { background: '#ffcf3a' }, { background: '#0f1c38' }],
          { duration: RUMBLE_MS / 6, iterations: 6 });

      // ハンドルがひとりでに勢いよく回り出す
      await knob.animate([
        { transform: 'rotate(0deg)' },
        { transform: 'rotate(1080deg)' }
      ], { duration: RUMBLE_MS, easing: 'cubic-bezier(.55, 0, .85, .35)' }).finished;

      // 閃光と同時に、取出口から光がはじける
      fxFlash.animate([{ opacity: 0 }, { opacity: 0.95, offset: 0.25 }, { opacity: 0 }], { duration: 550, easing: 'ease-out' });
      const mouth = centerOf(outlet);
      burst(mouth.x, mouth.y, 40, Math.max(window.innerWidth, window.innerHeight) * 0.35);
      await wait(350);
    }

    async function endDoubleEffects() {
      confetti(140);
      await Promise.all([
        fxDim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, delay: 600, fill: 'forwards' }).finished,
        fxRays.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, delay: 600, fill: 'forwards' }).finished
      ]);
      clearDoubleEffects();
    }

    function clearDoubleEffects() {
      if (raysSpin) {
        raysSpin.cancel();
        raysSpin = null;
      }
      [fxDim, fxRays, fxFlash].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    }

    function createCapsule(gold) {
      const capsule = document.createElement('div');
      capsule.className = 'capsule' + (gold ? ' is-gold' : '');
      capsule.innerHTML = '<span class="capsule-top"></span><span class="capsule-bottom"></span>';
      const color = gold ? '#ffcf3a' : capsuleColors[randomInt(capsuleColors.length)];
      capsule.style.setProperty('--cap', color);
      return capsule;
    }

    // 取出口からカプセルが落ちてきて、ぱかっと開いて番号の玉が出る
    async function revealSlot(slot, gold) {
      const ballWrap = slot.querySelector('.ball-wrap');
      const ball = slot.querySelector('.ball');
      const badge = slot.querySelector('.order-badge');
      const capsule = createCapsule(gold);
      ballWrap.appendChild(capsule);

      // 取出口の位置から、この玉の位置まで落とす（取出口に収まる大きさから始める）
      const from = centerOf(outlet);
      const to = centerOf(ballWrap);
      const dx = from.x - to.x;
      const dy = from.y - to.y;
      const startScale = Math.min(0.55, (outlet.getBoundingClientRect().width * 0.9) / capsule.getBoundingClientRect().width);

      await capsule.animate([
        { transform: `translate(${dx}px, ${dy}px) scale(${startScale})`, opacity: 0, offset: 0 },
        { transform: `translate(${dx}px, ${dy + 10}px) scale(${startScale})`, opacity: 1, offset: 0.12, easing: 'ease-in' },
        { transform: 'translate(0, 0) scale(1)', opacity: 1, offset: 0.6, easing: 'ease-out' },
        { transform: 'translate(0, -6%) scale(1)', opacity: 1, offset: 0.78, easing: 'ease-in' },
        { transform: 'translate(0, 0) scale(1)', opacity: 1, offset: 1 }
      ], { duration: 850, fill: 'forwards' }).finished;

      await capsule.animate([
        { transform: 'rotate(0deg)' },
        { transform: 'rotate(-9deg)' },
        { transform: 'rotate(8deg)' },
        { transform: 'rotate(-5deg)' },
        { transform: 'rotate(0deg)' }
      ], { duration: gold ? 700 : 500, fill: 'forwards' }).finished;

      const opening = { duration: 600, easing: 'ease-out', fill: 'forwards' };
      capsule.querySelector('.capsule-top').animate([
        { transform: 'none', opacity: 1 },
        { transform: 'translate(-12%, -40%) rotate(-30deg)', opacity: 0 }
      ], opening);
      capsule.querySelector('.capsule-bottom').animate([
        { transform: 'none', opacity: 1 },
        { transform: 'translate(10%, 30%) rotate(18deg)', opacity: 0 }
      ], opening);

      if (gold) {
        const point = centerOf(ballWrap);
        burst(point.x, point.y, 36, point.width * 0.9);
      }

      slot.classList.remove('is-pending');
      if (badge) {
        badge.animate([
          { opacity: 0, transform: 'translate(-50%, 0.4em)' },
          { opacity: 1, transform: 'translate(-50%, 0)' }
        ], { duration: 350, delay: 350, easing: 'ease-out', fill: 'backwards' });
      }
      await ball.animate([
        { transform: 'scale(0.35)', opacity: 0 },
        { transform: 'scale(1)', opacity: 1 }
      ], { duration: 600, easing: 'cubic-bezier(.3, 1.5, .5, 1)' }).finished;

      capsule.remove();
    }

    async function fadeIn(element) {
      element.classList.remove('is-pending');
      await element.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 }).finished;
    }

    let busy = false;
    function setBusy(value) {
      busy = value;
      handle.disabled = value || isFinished();
      handle.classList.toggle('is-turning', value);
      resetButton.disabled = value;
    }

    // 画面読み上げ用の説明（画面には表示しない）
    function describe(round) {
      if (round.length === 2) {
        return '2個出ました。1個目は' + round[0] + '番、2個目は' + round[1] + '番です。';
      }
      return round[0] + '番が出ました。';
    }

    // ---------- ボタンの動き ----------
    handle.addEventListener('click', async () => {
      if (busy || isFinished()) {
        return;
      }
      setBusy(true);
      // 結果は最初に確定して保存する（演出中に画面を閉じても、結果は失われない）
      const round = draw();
      const isDouble = round.length === 2;

      try {
        // いま表示している玉をしまう
        result.querySelectorAll('.slot, .priority-note').forEach((el) => {
          el.animate([
            { transform: 'scale(1)', opacity: 1 },
            { transform: 'scale(0.6)', opacity: 0 }
          ], { duration: 250, fill: 'forwards' });
        });

        if (reduceMotion) {
          await wait(1500);
        } else {
          await turnHandle();
        }

        // 出た玉を、隠した状態で並べておく
        result.innerHTML = resultHtml(round);
        const slots = Array.from(result.querySelectorAll('.slot'));
        const note = result.querySelector('.priority-note');
        slots.forEach((slot) => slot.classList.add('is-pending'));
        if (note) {
          note.classList.add('is-pending');
        }

        if (isDouble && !reduceMotion) {
          await doublePremonition();
        }
        // 1個目 → 2個目の順に出す
        for (const slot of slots) {
          if (reduceMotion) {
            await fadeIn(slot);
          } else {
            await revealSlot(slot, isDouble);
          }
        }
        if (note) {
          await fadeIn(note);
        }
        if (isDouble && !reduceMotion) {
          await endDoubleEffects();
        }
      } finally {
        // 演出が途中で失敗しても、最新の状態で画面を描き直す
        clearDoubleEffects();
        renderAll();
        setBusy(false);
        status.textContent = describe(round);
      }
    });

    reachButton.addEventListener('click', () => {
      state.reach = !state.reach;
      saveState();
      renderReach();
      status.textContent = state.reach ? 'リーチ中です。' : 'リーチを解除しました。';
    });

    resetButton.addEventListener('click', () => {
      if (!confirm('出た番号とリーチをすべて消して、最初からやり直しますか？')) {
        return;
      }
      state = freshState();
      saveState();
      renderAll();
      status.textContent = 'リセットしました。';
    });

    // 全画面表示（対応していないブラウザではボタンを出さない）
    if (document.fullscreenEnabled) {
      const updateFullscreenLabel = () => {
        fullscreenButton.textContent = document.fullscreenElement ? '全画面を終了' : '全画面';
      };
      fullscreenButton.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      });
      document.addEventListener('fullscreenchange', updateFullscreenLabel);
    } else {
      fullscreenButton.hidden = true;
      resetButton.classList.add('is-wide');
    }

    renderAll();
  })();
</script>
</body>
</html>
